<!doctype html>
<!--
  xG race: an example third-party graphics plugin for Second Half.

  Second Half loads this page in a sandboxed iframe with no network access and
  talks to it only by postMessage:
    plugin -> host  {type: "second-half/ready"}                 once loaded
    host -> plugin  {type: "second-half/render", lang, mode,     the data to draw
                     overlay: {kind, clock, headline, team, data: {xg_race: {now, teams, totals}}},
                     teams: {HOME: {name, short, color}, AWAY: {...}}}
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>xG race</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      body { font: 12px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; color: #e8eef5; }
      svg { display: block; width: 100%; height: 100%; }
      .grid { stroke: rgba(255, 255, 255, 0.08); stroke-width: 1; }
      .half { stroke: rgba(255, 255, 255, 0.28); stroke-width: 1; stroke-dasharray: 3 3; }
      .now { stroke: rgba(245, 197, 24, 0.6); stroke-width: 1; }
      .tick { fill: #8a9bb0; font-size: 10px; text-anchor: middle; }
      .line { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s ease-out forwards; }
      .goal circle { stroke: #0b1016; stroke-width: 1.5; }
      .goal text { font-size: 10px; font-weight: 600; text-anchor: middle; paint-order: stroke; stroke: #0b1016; stroke-width: 3px; }
      .total { font-size: 13px; font-weight: 700; paint-order: stroke; stroke: #0b1016; stroke-width: 3px; }
      .fade { opacity: 0; animation: fade 0.4s ease-out 1.2s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes fade { to { opacity: 1; } }
    </style>
  </head>
  <body>
    <svg id="chart" role="img" aria-label="xG race"></svg>
    <script>
      const NS = "http://www.w3.org/2000/svg";
      const svg = document.getElementById("chart");
      const HT = { en: "HT", es: "MT" };

      function el(name, attrs, text) {
        const node = document.createElementNS(NS, name);
        for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function render(msg) {
        const race = msg.overlay.data.xg_race;
        if (!race) return;
        const w = svg.clientWidth || 600;
        const h = svg.clientHeight || 150;
        const pad = { l: 8, r: 70, t: 12, b: 18 };
        const end = Math.max(90, race.now);
        const top = Math.max(1, race.totals.HOME, race.totals.AWAY) * 1.12;
        const x = (m) => pad.l + (m / end) * (w - pad.l - pad.r);
        const y = (v) => h - pad.b - (v / top) * (h - pad.t - pad.b);
        svg.replaceChildren();
        svg.setAttribute("viewBox", `0 0 ${w} ${h}`);

        for (const m of [15, 30, 45, 60, 75, 90]) {
          svg.append(el("line", { x1: x(m), x2: x(m), y1: pad.t, y2: h - pad.b, class: m === 45 ? "half" : "grid" }));
          svg.append(el("text", { x: x(m), y: h - 5, class: "tick" }, m === 45 ? HT[msg.lang] || "HT" : `${m}'`));
        }
        svg.append(el("line", { x1: pad.l, x2: w - pad.r, y1: h - pad.b, y2: h - pad.b, class: "grid" }));
        svg.append(el("line", { x1: x(race.now), x2: x(race.now), y1: pad.t, y2: h - pad.b, class: "now" }));

        // End labels, nudged apart when the totals are close.
        const labelY = { HOME: y(race.totals.HOME) + 4, AWAY: y(race.totals.AWAY) + 4 };
        if (Math.abs(labelY.HOME - labelY.AWAY) < 14) {
          const [hi, lo] = race.totals.HOME >= race.totals.AWAY ? ["HOME", "AWAY"] : ["AWAY", "HOME"];
          const mid = (labelY.HOME + labelY.AWAY) / 2;
          labelY[hi] = mid - 7;
          labelY[lo] = mid + 7;
        }

        for (const side of ["HOME", "AWAY"]) {
          const color = msg.teams[side].color;
          // Steps: flat between shots, a jump at each shot, carried on to the current minute.
          let d = `M ${x(0)} ${y(0)}`;
          let total = 0;
          for (const p of race.teams[side]) {
            d += ` H ${x(p.minute)} V ${y(p.total)}`;
            total = p.total;
          }
          d += ` H ${x(race.now)}`;
          svg.append(el("path", { d, class: "line draw", stroke: color, pathLength: 1 }));
          for (const p of race.teams[side].filter((s) => s.goal)) {
            const g = el("g", { class: "goal fade" });
            g.append(el("circle", { cx: x(p.minute), cy: y(p.total), r: 5, fill: color }));
            g.append(el("text", { x: x(p.minute), y: y(p.total) - 9, fill: "#fff" }, p.player.split(" ").slice(-1)[0]));
            svg.append(g);
          }
          svg.append(el("text", { x: x(race.now) + 8, y: labelY[side], fill: color, class: "total fade" },
            `${msg.teams[side].short} ${total.toFixed(2)}`));
        }
      }

      window.addEventListener("message", (e) => {
        if (e.source === window.parent && e.data && e.data.type === "second-half/render") render(e.data);
      });
      window.parent.postMessage({ type: "second-half/ready" }, "*");
    </script>
  </body>
</html>
